name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests
        run: node --test tests/core.test.js tests/background.test.js
      - name: Syntax checks
        run: |
          node --check content.js
          node --check background.js
          node --check tests/browser-smoke.mjs

